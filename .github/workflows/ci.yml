name: CI

on:
  # A pull request already runs every commit on its branch; pushes to other
  # branches would only start a second, identical run of the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    name: rc-${{ matrix.os }}-${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [clang]
        include:
          - os: ubuntu-latest
            cc: gcc
    env:
      CC: ${{ matrix.cc }}
      PKG_CONFIG: /nonexistent/shen-rc-pkg-config
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Independent toolchain
        run: nix develop -c env CC=${{ matrix.cc }} sh -c '$CC --version | head -n1; python3 --version'
      - name: Pinned release validator controls
        run: nix develop -c python3 test/rc/test_release_manifest.py
      - name: Default Make and RC unit tests
        run: |
          nix develop -c make CC=${{ matrix.cc }} -j2
          nix develop -c make CC=${{ matrix.cc }} test
      - name: Standalone CLI and compiler artifact audit
        run: |
          nix develop -c ./bin/shen-c --version
          nix develop -c scripts/test-rc.sh --audit-only bin/shen-rc
          nix develop -c scripts/test-rc.sh --audit-only bin/rc-build
      - name: Strict native cache and compiler failures
        run: nix develop -c python3 scripts/test-compile-cache.py bin/rc/test_native_compile
      - name: Compiler failure and timeout fall back to identical interpreted results
        run: nix develop -c python3 scripts/test-compile-fallback.py bin/shen-c
      - name: Compile-first pinned suite (cold and cached; zero interpreter entries)
        run: nix develop -c python3 scripts/test-compile-first.py bin/shen-c --timeout 1200
      - name: Reader capture and unsupported-state boundaries
        run: nix develop -c test/rc/test_reader_capture.sh ./bin/shen-rc
      - name: Native overrides match the pinned kernel's definitions
        run: nix develop -c python3 test/rc/test_kernel_overrides.py bin/shen-c
      - name: Shen source compilation
        run: nix develop -c env CC=${{ matrix.cc }} test/rc/test_source_compile.sh
      - name: Certify pinned release runme.shen
        run: nix develop -c make CC=${{ matrix.cc }} certify
      - name: Fresh standalone toolchain acceptance
        run: |
          receipt=$(python3 -c 'from pathlib import Path; print(sorted(Path("evidence/rc").glob("certify-*/result.json"))[-1])')
          nix develop -c env CC=${{ matrix.cc }} scripts/test-rc-toolchain.sh --canonical-receipt "$receipt"
      - name: CMake/Ninja RC build and tests
        run: |
          nix develop -c cmake -G Ninja -B build-ci \
            -D CMAKE_C_COMPILER=${{ matrix.cc }} \
            -D CMAKE_BUILD_TYPE=Release
          nix develop -c cmake --build build-ci -j2
          nix develop -c ctest --test-dir build-ci --output-on-failure
          nix develop -c ./build-ci/shen-rc eval -e '(+ 20 22)'
      - name: Installed package and source compiler
        if: matrix.cc == 'clang'
        run: nix build .#shen-c
      - name: Upload RC receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            evidence/rc/certify-*/
            evidence/rc/toolchain-*/
          if-no-files-found: error

  sanitize:
    name: rc-asan-ubsan
    runs-on: ubuntu-latest
    # Measured 636-825 s after the constant-data emitter. The 43.1 kernel
    # (dict, init, extensions) emits ~25% more C, and its instrumented build
    # exceeded certify's 300 s default; keep headroom for both.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: RC ownership and cycle sanitizer tests (default and boxed)
        run: |
          nix develop -c env ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 make CC=clang sanitize
          nix develop -c env ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 make -f Makefile.rc CC=clang RC_SANITIZE=1 RC_CPPFLAGS=-DSHEN_RC_IMMEDIATE_INTEGERS=0 RC_BUILD=obj/boxed RC_BIN=bin/boxed test
      - name: Emitted sanitizer ownership and semantic controls
        run: |
          nix develop -c make -f Makefile.rc CC=clang RC_SANITIZE=1 RC_BUILD=obj/rc-sanitize RC_BIN=bin/rc-sanitize RC_TOOL_BIN=bin/sanitize bin/sanitize/rc-build
          nix develop -c env CC=clang CFLAGS='-O1 -g -DSHEN_RC_VERIFY_OWNERSHIP=1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' RC_BIN=bin/rc-sanitize ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 scripts/test-rc.sh --no-build bin/sanitize/rc-build
      - name: Fully instrumented generated kernel and complete suite
        run: nix develop -c env CC=clang CFLAGS='-O1 -g -DSHEN_RC_VERIFY_OWNERSHIP=1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' RC_BUILD_TIMEOUT=1200 ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 scripts/certify-rc.sh
      - name: Strict native cache controls under fatal sanitizers
        run: nix develop -c env ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 python3 scripts/test-compile-cache.py bin/rc-sanitize/test_native_compile
